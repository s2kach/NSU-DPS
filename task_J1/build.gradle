plugins {
    id 'application'
}

group = 'ru.nsu.dizmestev'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}

application {
    mainClass = 'ru.nsu.dizmestev.Server'
}

tasks.register('client', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ru.nsu.dizmestev.Client'
}
